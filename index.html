<style>

.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.ph h2{margin:0}

.tk .tk-rn{font-weight:900;font-size:13px;color:#000}

@media print{.noprt{display:none!important}}

select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--g) 50%),linear-gradient(135deg,var(--g) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}

.dsh table{border-collapse:collapse}.dsh td,.dsh td *{font-weight:800;color:#000}.dsh small,.dsh small.mut{color:#000!important;font-weight:700}.dsh td{padding:3px 8px;font-size:15px;line-height:1.2;border:1.5px solid var(--g)}.nav{gap:4px}.nb{min-height:30px;height:30px;font-size:13px;padding:2px 10px}.w h1{margin:8px 0 0}.dsh2 .bt{font-size:12px;padding:3px 4px;min-height:28px;border-radius:8px}
</style></head><body>

<script>
const K='skp_db';let db=null;
try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
if(!db)db={clients:[{id:1,nom:'Client comptoir',solde:0}],fournisseurs:[],produits:[],depots:[{id:1,nom:'Dépôt principal'}],services:[],charges:[],prets:[],docs:[],appros:[],hist:[],users:[{id:1,nom:'Saliou',pin:'1234',role:'Administrateur'}],hidden:[],fonds:[],p:{nom:'SALIOU KHEWEUL PRO',adr:'',tel:''},seq:{}};
const OLDD='Dépôt principal (par défaut)';
function fixDep(){try{(db.depots||[]).forEach(d=>{if(d.nom==OLDD)d.nom='Dépôt principal'});(db.appros||[]).forEach(a=>{if(a.dep==OLDD)a.dep='Dépôt principal'})}catch(e){}}
fixDep();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
let me=null,cur='dash',Q='',DL=[],period='all';
const $=i=>document.getElementById(i),uid=()=>Date.now()+Math.floor(Math.random()*999);
const n=v=>parseFloat(v)||0,f=v=>Math.round(n(v)).toLocaleString('fr-FR')+' '+((db.p&&db.p.devise)||'FCFA');
const today=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const log=a=>{db.hist.unshift({d:new Date().toLocaleString('fr-FR'),u:me?me.nom:'-',a});db.hist=db.hist.slice(0,300)};
const nm=(k,id)=>{const x=db[k].find(r=>r.id==id);return x?x.nom:'—'};
const DT={facture:['Factures','FAC','Facture'],proforma:['Factures proforma','PRO','Facture proforma'],bc:['Bons de commande','BC','Bon de commande'],bl:['Bons de livraison','BL','Bon de livraison'],devis:['Devis','DEV','Devis']};
const PG=[['dash','📊','Tableau de bord'],['vente','⚡','Vente rapide'],['clients','👥','Clients'],['fournisseurs','🚚','Fournisseurs'],['produits','📦','Produits'],['stocks','📚','Stocks'],['appro','🔄','Ré-approvisionner'],['facture','🧾','Factures'],['proforma','📄','Factures proforma'],['bc','🛒','Bons de commande'],['bl','🚛','Bons de livraison'],['devis','✍️','Devis'],['charges','💸','Charges et dépenses'],['prets','🏦','Prêts et emprunts'],['fonds','🤝','Dépôts d’argent'],['rapports','📈','Rapports'],['hist','🕘','Historique'],['users','🔑','Utilisateurs'],['menus','🧭','Menus (pages visibles)'],['depots','🏬','Dépôts'],['services','🛠️','Services'],['params','⚙️','Paramètres']];
const M={
clients:{t:'Clients',f:[['nom','Nom'],['tel','Téléphone'],['email','Email'],['adr','Adresse'],['solde','Solde initial','n']]},
fournisseurs:{t:'Fournisseurs',f:[['nom','Nom'],['tel','Téléphone'],['email','Email'],['adr','Adresse'],['solde','Solde initial (dette)','n']]},
produits:{t:'Produits',f:[['img','Image','i'],['ref','Référence'],['nom','Désignation'],['cat','Catégorie'],['pa','Prix d’achat','n'],['pv','Prix de vente','n'],['qte','Stock','n'],['seuil','Seuil d’alerte','n'],['depot','Dépôt','s:depots'],['emp','Emplacement (ex. Étagère A)'],['marque','Marque / fabricant'],['unite','Unité'],['rempl','Produits similaires'],['note','Description / notes']]},
depots:{t:'Dépôts',f:[['nom','Nom du dépôt'],['adr','Adresse']]},
services:{t:'Services',f:[['nom','Service'],['prix','Prix','n']]},
charges:{t:'Charges et dépenses',f:[['date','Date','d'],['lib','Libellé'],['cat','Catégorie'],['montant','Montant','n']]},
prets:{t:'Prêts et emprunts',f:[['type','Type','o:Prêt,Emprunt'],['tiers','Personne / organisme'],['date','Date','d'],['montant','Montant','n'],['regle','Déjà réglé','n']]},
users:{t:'Utilisateurs',f:[['nom','Nom'],['pin','Code PIN'],['role','Rôle','o:Administrateur,Vendeur']]}};
const sumDocs=(fn)=>db.docs.filter(d=>d.type=='facture'&&fn(d)).reduce((a,d)=>a+d.total,0);
const inP=d=>period=='all'||(period=='m'?d.date.slice(0,7)==today().slice(0,7):d.date.slice(0,4)==today().slice(0,4));
function tiles(a){return '<div class="tl">'+a.map((x,i)=>`<div class="t ${i%2?'o':'g'}"><b>${x[0]}</b><i>${x[1]}</i><small>${x[2]||''}</small></div>`).join('')+'</div>'}
let SEL='';
const sec=(t,a,extra)=>{if(extra)SEL=extra;return a.map(x=>`<tr><td style="white-space:normal">${x[0]}${x[2]?` <small class="mut" style="white-space:nowrap;font-size:12.5px">· ${x[2]}</small>`:''}</td><td class="r" style="width:1%;white-space:nowrap"><b>${x[1]}</b></td></tr>`).join('')};
const okq=k=>!db.hidden.includes(k)&&can(k,'a');
function dash(){
const F=db.docs.filter(d=>d.type=='facture'),t=today(),cnt=x=>F.filter(x).length+' facture'+(F.filter(x).length>1?'s':'');
const J=d=>d.date==t,Mo=d=>d.date.slice(0,7)==t.slice(0,7),A=d=>d.date.slice(0,4)==t.slice(0,4);
const ca=sumDocs(()=>1),enc=F.reduce((a,d)=>a+d.paye,0);
const cl=db.clients.reduce((a,c)=>a+n(c.solde),0)+F.reduce((a,d)=>a+d.total-d.paye,0);

const al=db.produits.filter(p=>n(p.qte)<=n(p.seuil)).length;
const FP=F.filter(inP),vt=FP.reduce((a,d)=>a+d.total,0),cost=FP.reduce((a,d)=>a+d.lines.reduce((s,l)=>s+n(l.pa)*n(l.q),0),0);
const ch=db.charges.filter(inP).reduce((a,c)=>a+n(c.montant),0),bn=vt-cost;
const pr=db.prets.filter(p=>p.type=='Prêt'),em=db.prets.filter(p=>p.type=='Emprunt'),S=(a,k)=>a.reduce((x,p)=>x+n(p[k]),0);
const sel=`<select onchange="period=this.value;render()" style="margin-bottom:12px"><option value="all"${period=='all'?' selected':''}>Total (toutes dates)</option><option value="m"${period=='m'?' selected':''}>Ce mois</option><option value="y"${period=='y'?' selected':''}>Cette année</option></select>`;
SEL='';const ROWS=sec('Ventes',[['Vente du jour',f(sumDocs(J)),cnt(J)],['Vente du mois',f(sumDocs(Mo)),cnt(Mo)],['Vente de l’année',f(sumDocs(A)),cnt(A)],['Chiffre d’affaires total',f(ca),'encaissé : '+f(enc)]])
+sec('Créances et dettes',[['Créances clients',f(cl),'à recevoir'],['Dettes fournisseurs',f(dt),'à solder']])
+sec('Stocks',[['Stocks (Achats)',f(sa),'prix d’achat'],['Stocks (Ventes)',f(sv),'prix de vente'],['Marge potentielle du stock',f(sv-sa)],['Produits en alerte',al,db.produits.length+' produits']])
+sec('Résultats cumulés',[['Bénéfice hors charges',f(bn)],['Charges et dépenses',f(ch)],['Bénéfice net après charges',f(bn-ch)]],sel)

function sgInit(){const c=$('sgc');if(!c)return;const x=c.getContext('2d');x.lineWidth=3;x.lineCap='round';x.lineJoin='round';x.strokeStyle='#000';
const pos=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
c.onpointerdown=e=>{SGD=true;try{c.setPointerCapture(e.pointerId)}catch(_){}const[a,b]=pos(e);x.beginPath();x.moveTo(a,b);x.lineTo(a+.1,b+.1);x.stroke();e.preventDefault()};
c.onpointermove=e=>{if(!SGD)return;const[a,b]=pos(e);x.lineTo(a,b);x.stroke();e.preventDefault()};
c.onpointerup=c.onpointercancel=()=>{SGD=false}}
function sgClear(){const c=$('sgc');if(c)c.getContext('2d').clearRect(0,0,c.width,c.height)}
function sgTrim(c){const w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data;let a=w,b=h,e=-1,g=-1;
for(let i=0;i<h;i++)for(let j=0;j<w;j++)if(d[(i*w+j)*4+3]>10){if(j<a)a=j;if(j>e)e=j;if(i<b)b=i;if(i>g)g=i}
if(e<a)return null;const m=6;a=Math.max(0,a-m);b=Math.max(0,b-m);e=Math.min(w-1,e+m);g=Math.min(h-1,g+m);
const o=document.createElement('canvas');o.width=e-a+1;o.height=g-b+1;o.getContext('2d').drawImage(c,a,b,o.width,o.height,0,0,o.width,o.height);return o}
function sgSet(u){db.p.sign=u;log(u?'Signature électronique enregistrée':'Signature électronique supprimée');save();const e=$('sgp');if(e)e.innerHTML=sgPrev()}

function sgPick(e){const fl=e.files[0];if(!fl)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,500/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);sgSet(c.toDataURL('image/png'));alert('Signature importée. Elle apparaîtra sur tous les documents.')};im.src=r.result};r.readAsDataURL(fl);e.value=''}

const fdt=x=>x?x.split('-').reverse().join('/'):'—';
function fondsSec(){if(db.hidden.includes('fonds')||!can('fonds','v'))return '';const F=db.fonds,d=F.reduce((a,p)=>a+fSum(p,'Dépôt'),0),r=F.reduce((a,p)=>a+fSum(p,'Retrait'),0);
return sec('Dépôts d’argent confiés',[['Solde à restituer',f(d-r)],['Total déposé',f(d)],['Total retiré',f(r)],['Déposants',F.length,F.filter(p=>fSol(p)>0).length+' avec solde']])}
function fondsPage(){const A=can('fonds','a');
return `<div class="ph"><h2>Dépôts d’argent</h2><span class="stt" title="Total à restituer">À restituer : ${f(db.fonds.reduce((a,p)=>a+fSol(p),0))}</span></div><hr><p class="mut" style="white-space:normal">Argent confié par des personnes : enregistrez leurs dépôts, puis leurs retraits au fur et à mesure.</p><div class="bar"><input placeholder="Rechercher un déposant…" value="${esc(Q)}" oninput="Q=this.value;fondsFill()" aria-label="Rechercher">${A?`<button class="bt g" onclick="fondsForm()">+ Nouveau déposant</button>`:''}</div><div id="fb">${fondsTbl()}</div>`}
function fondsTbl(){const q=Q.toLowerCase(),L=db.fonds.filter(p=>[p.nom,p.tel,p.adr,p.cni].join(' ').toLowerCase().includes(q));
const rows=L.map(p=>{const s=fSol(p);return[esc(p.nom),esc(p.tel||'—'),f(fSum(p,'Dépôt')),f(fSum(p,'Retrait')),'<b>'+f(s)+'</b>',
(can('fonds','a')?`<button class="bt g sm" onclick="fondsOp(${p.id},'Dépôt')">➕ Dépôt</button>`+(s>0?`<button class="bt o sm" onclick="fondsOp(${p.id},'Retrait')">➖ Retrait</button>`:''):'')+`<button class="bt g sm" onclick="fondsRel(${p.id})">📜 Relevé</button>`+(can('fonds','m')?`<button class="bt g sm" onclick="fondsForm(${p.id})">Modifier</button>`:'')+(can('fonds','s')?`<button class="bt o sm" onclick="fondsDel(${p.id})">Suppr.</button>`:'')]});
return tbl(['Déposant','Téléphone','Total déposé','Total retiré','Solde',''],rows,'Total ('+L.length+') · Solde à restituer : '+f(L.reduce((a,p)=>a+fSol(p),0)))}
function fondsFill(){const e=$('fb');if(e)e.innerHTML=fondsTbl()}
function fondsForm(id){const p=id?db.fonds.find(x=>x.id==id):{};
modal(`<h2>${id?'Modifier':'Nouveau'} — Déposant</h2><label>Nom</label><input id="fn" value="${esc(p.nom)}"><label>Téléphone</label><input id="ft" type="tel" inputmode="tel" value="${esc(p.tel)}"><label>Adresse</label><input id="fa" value="${esc(p.adr)}"><label>Pièce d’identité (N° CNI)</label><input id="fi" value="${esc(p.cni)}"><label>Note</label><input id="fo" value="${esc(p.note)}">${id?'':`<label>Montant du dépôt (${esc(db.p.devise||'FCFA')})</label><input id="fm0" type="number" inputmode="decimal" min="0" placeholder="Montant confié"><label>Mode</label><select id="fmo0">${FM.map(m=>`<option>${m}</option>`).join('')}</select>`}<div class="bar" style="margin-top:16px;flex-wrap:nowrap"><button class="bt g" style="flex:1" onclick="closeM()">Annuler</button><button class="bt o" style="flex:1" onclick="fondsSave(${id||0})">Enregistrer</button></div>`)}
function fondsSave(id){const nom=$('fn').value.trim();if(!nom){alert('Renseignez le nom du déposant.');return}
const o={nom,tel:$('ft').value.trim(),adr:$('fa').value.trim(),cni:$('fi').value.trim(),note:$('fo').value.trim()};
if(id){Object.assign(db.fonds.find(x=>x.id==id),o);log('Modification · Déposant · '+nom);save();closeM();render();return}
o.id=uid();o.ops=[];db.fonds.push(o);log('Ajout · Déposant · '+nom);
const m=$('fm0')?n($('fm0').value):0;let oid=null;
if(m>0){const dt=today(),sq=(db.seq.dep||0)+1,x={id:uid(),type:'Dépôt',date:dt,montant:m,mode:$('fmo0').value,note:'',par:me?me.nom:'',num:'DEP-'+dt.slice(0,4)+'-'+String(sq).padStart(4,'0')};db.seq.dep=sq;o.ops.push(x);oid=x.id;log('Dépôt · '+nom+' · '+f(m)+' · '+x.num)}
save();closeM();render();if(oid)fondsRecu(o.id,oid)}
function fondsOp(pid,type){const p=db.fonds.find(x=>x.id==pid);if(!p)return;const s=fSol(p),R=type=='Retrait';
if(R&&s<=0){alert('Ce déposant n’a plus de solde à retirer.');return}
ui(`<h3>${R?'Retrait':'Dépôt'} · ${esc(p.nom)}</h3><p style="white-space:normal">Solde actuel : <b>${f(s)}</b></p><label>Montant</label><input id="fm" type="number" inputmode="decimal" min="0" placeholder="Montant">${R?`<button class="bt g sm" style="margin:6px 0 0" onclick="$('fm').value=${s}">Retirer tout le solde</button>`:''}<label>Date</label><input id="fd" type="date" value="${today()}"><label>Mode</label><select id="fmo">${FM.map(m=>`<option>${m}</option>`).join('')}</select><label>Note (facultatif)</label><input id="fno"><div class="bar" style="margin-top:14px;flex-wrap:nowrap"><button class="bt g" style="flex:1" onclick="closeD()">Annuler</button><button class="bt o" style="flex:1" onclick="fondsOpSave(${pid},'${type}')">Enregistrer</button></div>`)}
function fondsOpSave(pid,type){const p=db.fonds.find(x=>x.id==pid),m=n($('fm').value),dt=$('fd').value||today();if(!p)return;
if(m<=0){alert('Saisissez un montant supérieur à zéro.');return}
const k=type=='Dépôt'?'dep':'ret',sq=(db.seq[k]||0)+1;
const o={id:uid(),type,date:dt,montant:m,mode:$('fmo').value,note:$('fno').value.trim(),par:me?me.nom:'',num:(k=='dep'?'DEP':'RET')+'-'+dt.slice(0,4)+'-'+String(sq).padStart(4,'0')};
const ops=(p.ops||[]).concat(o);
if(type=='Retrait'&&!fOk(ops)){alert('Retrait refusé : le montant dépasse le solde disponible.');return}
db.seq[k]=sq;p.ops=ops;log(type+' · '+p.nom+' · '+f(m)+' · '+o.num);save();closeD();render();fondsRecu(pid,o.id)}
function fondsRecu(pid,oid){const p=db.fonds.find(x=>x.id==pid),r=p&&fRun(p).find(x=>x.o.id==oid);if(!r)return;
const o=r.o,R=o.type=='Retrait',DV=db.p.devise||'FCFA',z=v=>Math.round(n(v)).toLocaleString('fr-FR'),
I=(a,b)=>`<div class="tk-i"><span>${a}</span><span>${b}</span></div>`,S=(a,b,c)=>`<div class="tk-s ${c||''}"><span>${a}</span><span>${b}</span></div>`;
const h=`<div class="tk"><div class="dst"></div>${tkHead()}<div class="tk-b">${R?'Reçu de retrait':'Reçu de dépôt'}</div>${I('N°',esc(o.num))}${I('Date',fdt(o.date))}${I('Déposant',esc(p.nom))}${p.tel?I('Tél',esc(p.tel)):''}${I('Mode',esc(o.mode||'—'))}${I('Établi par',esc(o.par||'—'))}${o.note?I('Note',esc(o.note)):''}${S('Solde avant',z(r.av)+' '+DV,'f')}<div class="tk-t"><span>${R?'Retrait':'Dépôt'}</span><span>${z(o.montant)} ${DV}</span></div>${S('Nouveau solde',z(r.ap)+' '+DV)}<div class="tk-m">Signature du déposant</div><div style="height:34px;margin:0 12px 6px;border-bottom:1px solid #000"></div>${tkFoot()}<div class="dst"></div></div>`;
PT='ticket-'+o.num;$('pv').innerHTML=h;
ui(`<div style="overflow-x:auto">${h}</div><div class="bar" style="margin-top:14px"><button class="bt g" onclick="window.print()">🖨️ Imprimer</button><button class="bt o" onclick="fondsRel(${p.id})">📜 Relevé</button><button class="bt" style="background:var(--bg);color:var(--fg);border:3px solid var(--bd)" onclick="dlHtml()">⬇️ Télécharger</button></div>`,380)}
function fondsRel(pid){const p=db.fonds.find(x=>x.id==pid);if(!p)return;const R=fRun(p);
const T=tiles([['Total déposé',f(fSum(p,'Dépôt'))],['Total retiré',f(fSum(p,'Retrait'))],['Solde à restituer',f(fSol(p))],['Opérations',R.length]]);
const B=x=>`<button class="bt g sm" onclick="fondsRecu(${p.id},${x.o.id})">🎫 Reçu</button>`+(can('fonds','s')?`<button class="bt o sm" onclick="fondsOpDel(${p.id},${x.o.id})">Suppr.</button>`:'');
const h=coHead()+'<h2>Relevé — '+esc(p.nom)+'</h2><p><b>'+(p.tel?'Tél : '+esc(p.tel)+' · ':'')+(p.adr?esc(p.adr)+' · ':'')+'Édité le '+new Date().toLocaleDateString('fr-FR')+'</b></p>'+T+'<h3 style="margin-top:16px">Opérations</h3>'+tbl(['Date','N°','Opération','Mode','Montant','Solde après','<span class="noprt"> </span>'],R.map(x=>[fdt(x.o.date),esc(x.o.num),x.o.type,esc(x.o.mode||'—'),(x.o.type=='Retrait'?'− ':'+ ')+f(x.o.montant),f(x.ap),'<span class="noprt">'+B(x)+'</span>']),'Solde final : '+f(fSol(p)));
PT='releve-'+p.nom;$('pv').innerHTML=h;
ui(`<div style="overflow-x:auto">${h}</div><div class="bar" style="margin-top:14px"><button class="bt g" onclick="window.print()">🖨️ Imprimer</button><button class="bt o" onclick="dlHtml()">⬇️ Télécharger</button></div>`,900)}
function fondsOpDel(pid,oid){const p=db.fonds.find(x=>x.id==pid),o=p&&p.ops.find(x=>x.id==oid);if(!o)return;
askC('Supprimer '+o.type.toLowerCase()+' '+o.num+' de '+f(o.montant)+' ?',()=>{const ops=p.ops.filter(x=>x.id!=oid);
if(!fOk(ops)){alert('Suppression impossible : le solde deviendrait négatif à une date postérieure.');return}
p.ops=ops;log('Suppression · '+o.type+' · '+p.nom+' · '+o.num);save();render();fondsRel(pid)})}
function fondsDel(pid){const p=db.fonds.find(x=>x.id==pid);if(!p)return;
if(fSol(p)>0){alert('Ce déposant a encore '+f(fSol(p))+' confié. Enregistrez le retrait du solde avant de le supprimer.');return}
askC('Supprimer le déposant '+p.nom+' et tout son historique ?',()=>{db.fonds=db.fonds.filter(x=>x.id!=pid);log('Suppression · Déposant · '+p.nom);save();render()})}

render();
</script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js')}</script>
</body></html>
