<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SALIOU KHEWEUL PRO - Cloud</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>body{font-family:sans-serif;padding:15px;background:#f5f5f5} .card{background:white;padding:15px;border-radius:10px;box-shadow:0 2px 5px #ccc} input,button{padding:12px;width:100%;margin:5px 0;border-radius:8px;border:1px solid #ccc} button{background:#008751;color:white;font-weight:bold;border:none} #status{padding:10px;background:#e8f5e9;border-radius:8px;margin:10px 0}</style>
</head>
<body>
<div class="card">
<h2>SALIOU KHEWEUL PRO - Cloud ✅</h2>
<div id="status">Connexion...</div>
<input id="nom" placeholder="Nom du déposant">
<input id="montant" type="number" placeholder="Montant (F)">
<button onclick="ajouter()">Ajouter + Synchroniser</button>
<div id="liste" style="margin-top:15px"></div>
</div>

<script>
// CONFIG FIREBASE - saliou-kheweul-pro SANS E
const firebaseConfig = {
  apiKey: "AIzaSy...COLLE_TA_CLE_ICI",
  authDomain: "saliou-kheweul-pro.firebaseapp.com",
  projectId: "saliou-kheweul-pro",
  storageBucket: "saliou-kheweul-pro.appspot.com",
  messagingSenderId: "VOTRE_ID",
  appId: "VOTRE_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection("kheweul_pro").doc("data_principale");

let donnees = JSON.parse(localStorage.getItem('kheweul_data')||'[]');

function render(){
  document.getElementById('liste').innerHTML = donnees.map(d=>`<div style="border-bottom:1px solid #eee;padding:8px">${d.nom} - ${d.montant} F - ${d.date}</div>`).join('');
}

async function ajouter(){
  const nom=document.getElementById('nom').value;
  const montant=document.getElementById('montant').value;
  if(!nom||!montant)return alert('Remplis tout');
  const obj={nom,montant,date:new Date().toLocaleString(),id:Date.now()};
  donnees.push(obj);
  localStorage.setItem('kheweul_data',JSON.stringify(donnees));
  render();
  document.getElementById('nom').value='';
  document.getElementById('montant').value='';
  try{
    await docRef.set({donnees:donnees,updated:firebase.firestore.FieldValue.serverTimestamp()});
    document.getElementById('status').innerHTML="✅ Synchronisé Cloud - "+new Date().toLocaleTimeString();
  }catch(e){ document.getElementById('status').innerHTML="❌ Erreur: "+e.message; }
}

// Chargement depuis Cloud au démarrage
docRef.get().then(snap=>{
  if(snap.exists){
    donnees=snap.data().donnees||donnees;
    localStorage.setItem('kheweul_data',JSON.stringify(donnees));
    document.getElementById('status').innerHTML="✅ Cloud connecté - "+donnees.length+" enregistrements";
  }else{
    document.getElementById('status').innerHTML="✅ Prêt - Base vide, ajoute ton 1er dépôt";
  }
  render();
}).catch(e=>{document.getElementById('status').innerHTML="Mode hors-ligne: "+e.message; render();});

// Ecoute temps réel
docRef.onSnapshot(snap=>{ if(snap.exists){ donnees=snap.data().donnees||donnees; render(); } });
</script>
</body>
</html>
